name: Build v1.1.3 unsigned Fire TV APK

on:
  push:
    branches:
      - build/v1.1.3-unsigned-apk
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build unsigned release APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Prepare aligned unsigned APK and apksigner
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "$APK"
          BUILD_TOOLS="$(ls -1d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          mkdir -p release-tooling
          "$BUILD_TOOLS/zipalign" -p -f 4 "$APK" release-tooling/afterparty-firetv-v1.1.3-unsigned-aligned.apk
          cp "$BUILD_TOOLS/lib/apksigner.jar" release-tooling/apksigner.jar
          printf 'build_tools=%s\n' "$BUILD_TOOLS" > release-tooling/build-info.txt
          sha256sum release-tooling/afterparty-firetv-v1.1.3-unsigned-aligned.apk >> release-tooling/build-info.txt

      - name: Upload unsigned build
        uses: actions/upload-artifact@v4
        with:
          name: afterparty-v1.1.3-unsigned
          path: release-tooling/
          if-no-files-found: error
          retention-days: 1
