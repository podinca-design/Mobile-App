  var step=1,total=16,submitted=false,form=document.getElementById('tpiForm'),err=document.getElementById('tpiError'),draftStatus=document.getElementById('tpiDraftStatus'),draftKey='touchpointTrustIntakeDraftV1',saveTimer=null;
